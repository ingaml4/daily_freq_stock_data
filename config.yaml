# ============================================================================
# emscan 配置：服务器上**只需要填这一个 licence**，其余全部有默认值。
#
# 不想把证书写进文件，就用环境变量（推荐，容器/CI 里也方便）：
#     export MAIRUI_LICENCE=XXXX-XXXX-XXXX-XXXX-XXXX
# 容器里还可以覆盖行情库位置：
#     export EMSCAN_STORE_PATH=/data/market.sqlite
#
# 所有可调项的完整清单与含义见 README 的"配置"一节（默认值在 emscan/config.py）。
# ============================================================================

mairui:
  # 麦蕊智数证书：https://www.mairui.club 免费领取（按证书档位限频）
  licence: ""

  # ↓↓↓ 下面这些按需再改，不改也能跑 ↓↓↓

  # 证书限频（次/分钟）：基础 300 / 包月·体验 1000 / 包年 3000 / 钻石 6000。
  # 填对了才能把"全市场 + 技术指标"的回补时间算准（脚本按下限节流，不会超频）。
  # rate_limit_per_min: 300
  # 并发线程数：默认 8，只影响同一分钟内的"挤出速度"，不会突破上面的限频
  # workers: 8
  # 当日快照取数方式：
  #   auto（默认）= 多股(20 只/次) → 逐只；**不试全市场接口**（那个要 Pro/包年档，没权限会 429）
  #   all = 全市场接口（hsrl/real/all，一次拿全市场；仅当证书含"全市场"权限时用）
  # spot_mode: auto
  # 日线除权方式：f=前复权（默认） n=不复权 b=后复权 fr/br=等比前/后复权
  # kline_adjust: f
  # 没有流通股本时，是否逐只抓《股票基础信息》补 fv（首次全市场会多花十几分钟）
  # fetch_instrument: false

# 自愈比对窗口：往前看多少自然日来找"缺了哪天"（45 ≈ 30 个交易日）
# reconcile_calendar_days: 45

# 单次运行最多处理多少只股票（0=不限）。证书限频低时设成 800，多次运行自动收敛。
# sync:
#   max_symbols_per_run: 0
#   history_years: 3          # 首次回补拉几年历史（3 年够用；0=从头全量，很慢）

# 每天抓哪些日频指标（每次请求只拿一种指标的一只股票，所以请求数=股票数×种类）
# indicators:
#   enabled: true
#   kinds: [macd, kdj, boll]   # 可选 ma
#   source: local              # local=本地按日线算（默认，零接口请求、毫秒级）；api=拉麦蕊接口
#   local_chunk: 400           # 本地计算一批多少只（2G 内存保持 300~500）
#   local_days: 5              # 每天只重算最近 5 个交易日（判金叉/触轨够用）
#   limit: 10                  # 日更只取最近 10 条，够判断金叉
#   publish_time: "15:35"      # 当日指标发布时间，早于它运行就跳过当天（省请求）

# 指标信号筛选（金叉 / 布林下轨 …）
# signals:
#   enabled: true
#   match: any                 # any=命中任一（默认） all=必须同时满足
#   rules: [macd_golden, kdj_golden, boll_break_lower]
# 四个"主信号"（跑完 run 后可用 `python3 -m emscan hits` 直接查）：
#   突然放量        = scan 的命中规则（量比5≥2 且 (量比20≥1.5 或 Z60≥3)，成交额/换手率门槛）
#   MACD金叉        = macd_golden
#   KDJ金叉         = kdj_golden
#   BOLL下轨突破    = boll_break_lower（收盘 ≤ 布林下轨；想用"最低价触及下轨"就换成 boll_lower）
# 备选规则：
#   macd_golden MACD金叉  macd_dead MACD死叉
#   kdj_golden  KDJ金叉   kdj_dead  KDJ死叉
#   ma_golden   MA5上穿MA10（需要 indicators.kinds 含 ma）
#   boll_lower  触及布林下轨   boll_break_lower 收在下轨之下
#   boll_upper  触及布林上轨   boll_break_upper 收在上轨之上

# 推送（默认关闭；webhook 支持飞书/企业微信/钉钉/Slack，或邮件）
# notify:
#   enabled: false
#   webhook: {type: feishu, url: ""}

# 网页端：python3 -m emscan web（四个查询按钮 + 可排序表格 + 代码跳雪球）
# web:
#   host: 127.0.0.1     # 只本机；对外暴露改成 0.0.0.0 并设置 token / 用反向代理加认证
#   port: 8080
#   title: A股日频信号
#   limit: 300          # 单页最多显示多少行
#   password: ""        # 访问口令（也可用 EMSCAN_WEB_PASSWORD；空=开放访问，只适合本机）
#   session_days: 7     # 登录后 Cookie 记住几天
#   remember_sort: true # 用浏览器本地存储记住上次排序列（排序本身是纯前端的，不进 URL）
#   update_times: "15:32,17:15"   # 页面上"系统几点更新"的提示（install_services.sh 会按 --daily-times 写进 env）
